name: Content validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-check:
    name: content-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-content.txt
      - name: Check protected source and immutable published URLs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_changes.py
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate static site
        run: python scripts/build.py
      - name: Upload review artifact (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: site-review-${{ github.run_id }}
          path: dist/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
