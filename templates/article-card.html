<div class="col-lg-6" data-article-card data-category="{{ a.category }}">
<a class="article-card" href="{{ a.url }}">
<img src="{{ a.hero_image }}" alt="{{ a.hero_alt }}" />
<div class="article-card-body"><p class="article-category">{{ a.category_label }}</p>
<p class="article-card-label">{{ a.kicker }}</p>
<h3>{{ a.title }}</h3><p>{{ a.description }}</p><span>아티클 보기</span></div>
</a></div>
